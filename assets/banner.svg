<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="purpleGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".2"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><filter id="blurFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur stdDeviation="40"/></filter><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb1{0%{transform:translate(0,0) scale(1);opacity:.6}50%{transform:translate(30px,-20px) scale(1.15);opacity:.85}}@keyframes pulseOrb2{0%{transform:translate(0,0) scale(1);opacity:.5}50%{transform:translate(-25px,25px) scale(1.2);opacity:.8}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes waveMotion{0%{stroke-dashoffset:0}}.orb1,.orb2{animation:pulseOrb1 8s ease-in-out infinite;transform-origin:center}.orb2{animation:pulseOrb2 10s ease-in-out infinite}.floating-badge{animation:floatCard 6s ease-in-out infinite}.wave-line{stroke-dasharray:10 15;animation:waveMotion 12s linear infinite}.subtitle-text,.tag-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:52px;fill:url(#textGrad)}.subtitle-text{font-weight:400;font-size:20px;fill:#94a3b8}.tag-text{font-weight:600;font-size:13px;fill:#fff}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="100" r="140" fill="url(#purpleGlow)" class="orb1" filter="url(#blurFilter)"/><circle cx="1000" cy="260" r="160" fill="url(#cyanGlow)" class="orb2" filter="url(#blurFilter)"/><path stroke="#334155" stroke-opacity=".15" stroke-width="1" d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/><path stroke="#334155" stroke-opacity=".15" stroke-width="1" d="M200 0 V360 M400 0 V360 M600 0 V360 M800 0 V360 M1000 0 V360"/><path fill="none" stroke="#6366f1" stroke-opacity=".3" stroke-width="2" d="M 50 300 C 300 200, 500 340, 750 220 C 950 120, 1050 250, 1150 180" class="wave-line"/><path fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-width="2" d="M 50 100 C 250 220, 550 80, 800 180 C 980 260, 1080 140, 1150 280" class="wave-line"/><g><g class="floating-badge" transform="translate(80, 140) translate(0, -60)"><polygon fill="url(#badgeGrad)" points="30 0 60 17 60 52 30 69 0 52 0 17" filter="url(#glow)"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M 18 34 L 27 43 L 43 25"/></g><text x="80" y="-10" class="title-text" filter="url(#glow)" transform="translate(80, 140)">Awesome Digital Credentialing</text><text x="80" y="32" class="subtitle-text" transform="translate(80, 140)">Curated SaaS Platforms, Open-Source Tools &amp; Standards for Digital Badges &amp; Verifiable Credentials</text><g transform="translate(80, 140) translate(80, 65)"><rect width="150" height="32" x="0" y="0" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" rx="16"/><text x="75" y="20" class="tag-text" text-anchor="middle">🎓 Open Badges 3.0</text><rect width="180" height="32" x="162" y="0" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" rx="16"/><text x="252" y="20" class="tag-text" text-anchor="middle">🛡️ W3C Verifiable Credentials</text><rect width="170" height="32" x="354" y="0" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" rx="16"/><text x="439" y="20" class="tag-text" text-anchor="middle">📜 Micro-Credentials</text><rect width="140" height="32" x="536" y="0" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="16"/><text x="606" y="20" class="tag-text" text-anchor="middle">⚡ Open Source</text></g></g></svg>