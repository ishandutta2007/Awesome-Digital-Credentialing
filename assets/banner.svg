<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Filters for Ambient Glow -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb1 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.6; }
      50% { transform: translate(30px, -20px) scale(1.15); opacity: 0.85; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.5; }
      50% { transform: translate(-25px, 25px) scale(1.2); opacity: 0.8; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.5; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes waveMotion {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    .orb1 { animation: pulseOrb1 8s ease-in-out infinite; transform-origin: center; }
    .orb2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: center; }
    .floating-badge { animation: floatCard 6s ease-in-out infinite; }
    .wave-line { stroke-dasharray: 10 15; animation: waveMotion 12s linear infinite; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#textGrad); }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .tag-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #ffffff; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb1" cx="200" cy="100" r="140" fill="url(#purpleGlow)" filter="url(#blurFilter)" />
  <circle class="orb2" cx="1000" cy="260" r="160" fill="url(#cyanGlow)" filter="url(#blurFilter)" />

  <!-- Background Decorative Grid Pattern -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#334155" stroke-opacity="0.15" stroke-width="1" />
  <path d="M200 0 V360 M400 0 V360 M600 0 V360 M800 0 V360 M1000 0 V360" stroke="#334155" stroke-opacity="0.15" stroke-width="1" />

  <!-- Animated Tech Connection Lines -->
  <path class="wave-line" d="M 50 300 C 300 200, 500 340, 750 220 C 950 120, 1050 250, 1150 180" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="2" />
  <path class="wave-line" d="M 50 100 C 250 220, 550 80, 800 180 C 980 260, 1080 140, 1150 280" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" />

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(80, 140)">
    <!-- Badge Icon Graphics -->
    <g class="floating-badge" transform="translate(0, -60)">
      <!-- Outer Hexagon Badge Icon -->
      <polygon points="30,0 60,17 60,52 30,69 0,52 0,17" fill="url(#badgeGrad)" filter="url(#glow)" />
      <!-- Checkmark -->
      <path d="M 18 34 L 27 43 L 43 25" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title -->
    <text x="80" y="-10" class="title-text" filter="url(#glow)">Awesome Digital Credentialing</text>
    
    <!-- Subtitle -->
    <text x="80" y="32" class="subtitle-text">Curated SaaS Platforms, Open-Source Tools &amp; Standards for Digital Badges &amp; Verifiable Credentials</text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(80, 65)">
      <!-- Pill 1: Open Badges 3.0 -->
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="75" y="20" text-anchor="middle" class="tag-text">🎓 Open Badges 3.0</text>

      <!-- Pill 2: W3C VC -->
      <rect x="162" y="0" width="180" height="32" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="252" y="20" text-anchor="middle" class="tag-text">🛡️ W3C Verifiable Credentials</text>

      <!-- Pill 3: Micro-Credentials -->
      <rect x="354" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="439" y="20" text-anchor="middle" class="tag-text">📜 Micro-Credentials</text>

      <!-- Pill 4: Open Source -->
      <rect x="536" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="606" y="20" text-anchor="middle" class="tag-text">⚡ Open Source</text>
    </g>
  </g>
</svg>
